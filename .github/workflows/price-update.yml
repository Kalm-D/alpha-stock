name: Cập nhật giá 15h Việt Nam
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1-5'
  workflow_dispatch:
    inputs:
      test_only:
        description: 'Chỉ kiểm tra nguồn ba sàn, không xuất bản'
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: alpha-stock-prices
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: price-cache
          key: prices-v1-${{ github.run_id }}
          restore-keys: prices-v1-
      - name: Chuẩn bị website
        run: |
          mkdir -p site
          cp index.html alpha-stock-logo.png huong_dan_su_dung_alpha_stock.pdf site/
          touch site/.nojekyll
      - name: Tải giá ba sàn
        if: github.event_name != 'push'
        env:
          TEST_ONLY: ${{ inputs.test_only || 'false' }}
        run: python -u update_prices.py
      - uses: actions/cache/save@v4
        if: always() && github.event_name != 'push' && inputs.test_only != true
        with:
          path: price-cache
          key: prices-v1-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        if: inputs.test_only != true
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
        if: inputs.test_only != true
