name: Publish Alpha Stock from shared market snapshot
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 15 * * 1-5'
      timezone: 'Asia/Ho_Chi_Minh'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: alpha-stock-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare website
        run: |
          mkdir -p site
          cp index.html alpha-stock-logo.png huong_dan_su_dung_alpha_stock.pdf site/
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
